name: Release

# Triggers on tag push (e.g. `git push origin v0.1.3`). Cross-compiles the
# Zig binary for every supported target on a single Linux runner (zig
# cross-compiles natively), uploads each plus SHA256SUMS as GitHub release
# assets, then publishes the npm package whose postinstall downloads and
# verifies them.
#
# Re-running is safe: publish.mjs skips tag creation on tag-triggered runs,
# re-uploads assets to an existing release with --clobber, and skips
# `npm publish` when the version is already on the registry.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # for `gh release create`
  id-token: write   # for npm provenance / trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json, build.zig.zon, src/root.zig
        run: node scripts/publish.mjs --check-versions --expect-version="${GITHUB_REF_NAME#v}"

      - name: Check npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN present: token publish with --provenance"
          else
            echo "::warning::NPM_TOKEN secret not set; relying on npm trusted publishing (OIDC). Configure a trusted publisher for this repo/workflow on npmjs.com, or the publish step fails."
          fi

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version

      - name: zig build test
        run: zig build test

      - name: Release (build prebuilts, SHA256SUMS, GH release, npm publish)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish.mjs --skip-git --skip-tests
