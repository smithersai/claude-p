name: Deploy Docs

# Automatically rebuilds and publishes the Starlight documentation site,
# Engineering Wiki, Mythical History, live Lighthouse Uphill Audit Report,
# and llms.txt whenever changes merge to main (from Smithers Cloud or GitHub).

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - 'SPEC.md'
      - '.smithers/**'
      - '.agents/uphill/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SMITHERS_TRUST_TIER: trusted_maintainer_sandbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install zig 0.15.2
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Run Uphill metrics for live Lighthouse audit
        uses: wevm/uphill@f71fba4d199409cbc8bf00d713dab4b24d91b980 # main

      - name: Sync Engineering Wiki and render Lighthouse Audit Report
        run: |
          node .smithers/flows/wiki/sync-wiki.mjs --write
          node .smithers/audit/generate-lighthouse.mjs --no-run

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build Starlight site
        working-directory: docs
        run: npm run build

      - name: Verify llms.txt and live Lighthouse audit output
        run: |
          test -s docs/dist/llms.txt
          test -s docs/dist/audit/index.html
          test -s docs/dist/audit/audit.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
