name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: LICENSE exists
        run: test -s LICENSE || { echo "::error::LICENSE file is missing or empty"; exit 1; }

      - name: Versions agree (package.json, build.zig.zon, src/root.zig)
        run: node scripts/publish.mjs --check-versions

      - name: Release scripts parse & SHA256 installer tests
        run: |
          node --check scripts/install.js && node --check scripts/publish.mjs && node --check bin/claude-p.js
          sh -n scripts/build-in-linux.sh && bash -n scripts/fuzz-linux.sh
          node --test .smithers/tests/install-checksum.test.mjs
          node --test tests/prop/js_supplychain_prop.mjs

      - name: Factory projections are not stale (.smithers/factory.json, home.json)
        # Re-derives projected fields from flow.mdx frontmatter and FACTORY.ts.
        # On failure run: smthrs target //.smithers:factory-write --write
        run: node --test .smithers/tests/factory-projections.test.mjs

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install zig 0.15.2
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: zig build
        run: zig build -Doptimize=ReleaseSafe

      - name: zig build test
        run: zig build test

      - name: Coverage-guided Zig fuzz (all targets, 60s)
        run: FUZZ_SECONDS=60 ./scripts/fuzz-linux.sh

  cross-compile:
    # Same targets and flags as scripts/publish.mjs, so a release tag never
    # discovers a broken target for the first time.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - x86_64-linux-musl
          - aarch64-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install zig 0.15.2
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: zig build (${{ matrix.target }})
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -p out

      - name: Binary exists
        run: test -s out/bin/claude-p && file out/bin/claude-p
