name: Uphill

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  uphill:
    name: Uphill Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run Uphill
        uses: wevm/uphill@main

      - name: Render Lighthouse-style Audit Report (untrusted PR provenance)
        run: node .smithers/audit/generate-lighthouse.mjs --no-run --skip-docs

      - name: Upload Lighthouse Audit Report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-audit-pr
          path: |
            .smithers/reports/audit.html
            .smithers/reports/audit.json
          retention-days: 14
