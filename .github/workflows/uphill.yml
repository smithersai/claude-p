name: Uphill

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  uphill:
    name: Uphill Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Run Uphill
        uses: wevm/uphill@f71fba4d199409cbc8bf00d713dab4b24d91b980 # main

      - name: Render Lighthouse-style Audit Report (untrusted PR provenance)
        run: node .smithers/audit/generate-lighthouse.mjs --no-run --skip-docs

      - name: Upload Lighthouse Audit Report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-audit-pr
          path: |
            .smithers/reports/audit.html
            .smithers/reports/audit.json
          retention-days: 14
